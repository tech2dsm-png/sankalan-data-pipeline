services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: sankalan-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_QUOTA_PRODUCER_DEFAULT: 1048576
      KAFKA_QUOTA_CONSUMER_DEFAULT: 1048576
    ports:
      - "9092:9092"
    networks:
      - sankalan-network
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[k]afka' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:15
    container_name: sankalan-postgres
    environment:
      POSTGRES_USER: sankalan
      POSTGRES_PASSWORD: sankalan123
      POSTGRES_DB: analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sankalan-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sankalan"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  sankalan-network:
    driver: bridge

volumes:
  postgres_data: